[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-docs-kit"
version = "0.1.0"
description = "Claude skills that write branded reports and decks as PDF, check every build against a brand rulebook, and learn from comments in Word and PowerPoint."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Guillaume Picard" }]
classifiers = ["Development Status :: 1 - Planning"]
dependencies = ["python-docx", "python-pptx", "anthropic", "fonttools", "openpyxl", "pdfplumber>=0.11", "Pillow>=13", "pydantic>=2", "pypdfium2>=5.14", "PyYAML>=6"]

[project.scripts]
ai-docs-kit = "ai_docs_kit.cli:main"

[project.urls]
Repository = "https://github.com/gwpicard/ai-docs-kit"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_docs_kit"]

[dependency-groups]
dev = ["pytest>=8", "types-openpyxl", "ruff", "mypy", "hypothesis", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs", "tests/judge"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ARG001", "ARG002", "D103"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["D103"]
"tests/**" = ["ARG001", "ARG002", "D103"]
"src/ai_docs_kit/*.py" = ["D103"]
"src/ai_docs_kit/agents/**" = ["D103"]
"src/ai_docs_kit/brand/**" = ["D103"]
"src/ai_docs_kit/doctypes/**" = ["D103"]
"src/ai_docs_kit/evals/**" = ["D103"]
"src/ai_docs_kit/facts/**" = ["D103"]
"src/ai_docs_kit/intake/**" = ["D103"]
"src/ai_docs_kit/loop/**" = ["D103"]
"src/ai_docs_kit/model/**" = ["D103"]
"src/ai_docs_kit/render/**" = ["D103"]
"src/ai_docs_kit/review/**" = ["D103"]
"src/ai_docs_kit/source/**" = ["D103"]
"src/ai_docs_kit/testing/**" = ["D103"]
"src/ai_docs_kit/theme/**" = ["D103"]
"src/ai_docs_kit/themes/**" = ["D103"]
"tests/judge/test_p0_1_tooling.py" = ["F401"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.12"
